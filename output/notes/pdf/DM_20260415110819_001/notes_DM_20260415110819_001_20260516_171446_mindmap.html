# 古希腊的科学成就

## 万物构成的基本问题

古希腊哲学家探讨了万物的组成成分，提出了关于宇宙基本组成的哲学问题。

## 测量地球周长

### 埃拉托斯特尼的方法

埃拉托斯特尼（Eratosthenes of Cyrene, 276 BC-194 BC）利用太阳光线和角度测量地球周长。

### 原理

通过测量地球表面两点之间太阳光线的夹角（角度θ），结合已知的距离D，可以计算地球周长C。

### 公式

θ/360° = D/C

C = D × 360° ÷ θ

### 实例计算

- 在赛尼（Syene）和亚历山大城（Alexandria）之间测量到太阳光线夹角为7°。
- 已知两地距离D为5000stadia。
- 计算地球周长C：

C = 5000 stadia × 360° ÷ 7°

C ≈ 25714 stadia

- 根据埃拉托斯特尼的数据，赛尼和亚历山大城之间实际距离约为5000stadia，地球周长约为250000stadia（约40000km）。

### 测量点

- 赛尼（Syene）：位于北回归线上，夏季正午太阳直射。
- 亚历山大城：位于赛尼北方，太阳光线有夹角。
- 两地连线与地球中心连线平行。

# 测量地球周长

**分类**: 数学

**要点**:
- 埃拉托斯特尼利用夏至日的影子长度计算地球周长
- 亚历山大港与阿斯旺之间的距离为地球周长的 θ/360°
- 测量结果显示地球周长在 39,690 千米到 46,620 千米之间
- 经过两极的地球实际周长为 40,008 千米

**公式**:
θ/360°

**原文**: 埃拉托斯特尼知道在一年之中白天最长的那天 (夏至日) 正午时分,太阳正好在希尼 (也叫阿斯旺。处于北回归线) 天顶的位置。因为此时太阳光垂直射入希尼城内的一口深井 中。  他假设亚历山大港在阿斯旺的正北方 (实际上亚历山大 港在阿斯旺偏西一点) 他在夏至日正午时分。测量了亚历 山大城里一个方尖石塔投下影子的长度, 计算出了这个时候 太阳在亚历山大的天顶以南 7°。 他推断出亚历山大港到阿  斯旺的距离一定是整个地球圆周的 θ/360° 现在普遍认为他推断出的距离应该在39,690千米到 46,620千米之间 (经过两极的地球实际周长是40,008千米) 。

**摘要**: 通过夏至日的影子长度，埃拉托斯特尼计算出地球周长约为39,690千米到46,620千米之间，即地球周长的 θ/360°

# 西方科学和哲学的起源

**分类**: 哲学

**要点**:
- 泰勒斯是古希腊时期的科学家和哲学家，出生于米利都城
- 他是西方历史上第一个有记载的名字留下的思想家，被称为‘科学和哲学之祖’
- 泰勒斯提出了‘世界的本原是什么？’这个问题，并认为世界本原是水

**原文**: 泰勒斯 &#x27;Thales of Miletus (624 -546 BC), 古希腊时期的思想家。科学家。哲学家。出生 于米利都城。西方思想史上第一个有记载有名 字留下来的思想家。被称为 &quot;科学和哲学之 祖》  泰勒斯是古希腊及西方第一个自然科学 家和哲学家  泰勒斯提出问题: 世界的本原是什么? 他认为世界本原是水。

**摘要**: 介绍了泰勒斯作为西方科学和哲学的奠基人之一，他提出了关于世界本原的重要问题，并认为世界本原是水。

# 希腊自然哲学（唯物主义）

**分类**: 哲学

**要点**:
- 泰勒斯认为‘水’是万物的本原
- 阿那克西曼德提出‘无限定’的概念，即没有固定的界限
- 阿那克西米尼认为‘气’是万物的本原
- 赫拉克利特主张‘火’是万物的本原
- 恩培多克勒提出‘四根说’，包括火、气、水、土
- 阿那克萨哥拉提出‘种子说’，认为事物的本原是它自己的‘种子’
- 原子论者留基波和德谟克利特认为‘原子’是万物的本原

**原文**: 米利都学派 泰勒斯_ 《水》是万物的本原  阿那克西曼德^  无限定。即无固定限界 阿那克西米尼 形式和性质的物质 &quot; 是 万物本原 《气》是万物的本原  赫拉克利特 火是万物的本原  恩培多克勒  四根说  火、气、水、土 事物的本原是它自己的  种子&quot; 阿那克萨哥拉  种子说 &quot; 原子论者  留基波 德谟克利特  原子是万物的本原

**摘要**: 古希腊的自然哲学家们提出了不同的宇宙本原理论，包括水、无限定、气、火、四根说、种子说以及原子论等。

# 希腊自然哲学的发展特点

## 发展特点

- 希腊自然哲学强调从物质角度解释自然现象。
- 学生总是提出新观点，不断超越老师。
- 一代一代的哲学家不断追问，探索世界的本原。

## 太阳、地球和月球的半径大小

- 太阳的半径约为696,340公里。
- 地球的半径约为6,371公里。
- 月球的半径约为1,737公里。

## 亚里士多德的著作《论天》

### 月食与地球形状的证明

- 在月食中，轮廓总是弯曲的。
- 由于地球的介入使得月食发生，这条线路的形式由地球表面的形式引起，因此它是球形的。

### 星星观测与地球形状的证明

- 对星星的观察表明，地球不仅是圆形的，而且是一个不大的圆。
- 位置向南或向北的微小变化都会引起地平线的明显改变。
- 头顶上的星星有明显变化，当人们向北或向南移动时，看到的星星是不同的。
- 所有这些不仅表明地球是圆形的，而且也表明它是一个尺寸不大的球体。

# 地球为什么是圆的？

## 分类: 天文学

### 要点:
- 因为造成月食的是处于太阳和月球之间的地球挡住了太阳射在月球表面的光芒所造成的阴影，而这个阴影是呈弧形逐渐遮挡住太阳光的。以此便可推断地球是球体形状。
- 原文: 地球为什么是圆的? 因为造成月食的是处于太阳和月球之间的地球挡住了太阳射在月球表面的光芒所造成的阴影。这个阴影是呈弧形逐渐遮挡住太阳光的。以此便可推断地球是球体形状。
- 讲解: 也正是因为这样,前人提出的观点才能够被后人证明是对还是错,从而一步一步推动科学向前发展。
- 摘要: 通过观察月食现象，可以推断出地球是球体形状。

## 测量推算太阳与月亮的远近和相对大小

### 分类: 天文学

### 要点:
- 当月亮在上弦月时，人的视线方向与阳光照射月亮的方向正好是垂直的。
- 此时，记录下太阳与月亮方向的夹角α。夹角α的余弦就是月地距离与日地距离的比值。
- 进一步，由于太阳和月亮看起来几乎是一样大的，距离的比值也等于它们直径的比值。
- 原文: 测量推算太阴与月亮的远近和相对大小 月球 阿里斯塔克斯 90&quot; 太阳 Aristarchus of Samos (310 -230 BC) 地球
- 公式:
  - `cos(α) = 月地距离 ÷ 日地距离`
  - `日地距离 ÷ 月地距离 = 太阳直径 ÷ 月亮直径`
- 摘要: 通过测量夹角α的余弦值来推算太阳与月亮的距离比，并利用太阳和月亮看起来一样大的特性推导出它们的直径比。

## 测量推算地球与月球的距离与相对大小

### 分类: 天文学

### 要点:
- 通过观察月食过程，利用月球穿越地球阴影所需时间来计算月球轨道长度与直径比值。
- 根据这些数据，进一步估算出地球半径与月球半径之比，以及月地距离与月球半径的比值。
- 如果已知地球半径，就能得到日地距离、月地距离，以及太阳、地球和月亮三者半径的关系。
- 原文: 测量推算地球与月球的距离与相对大小 本影 半影 在月食过程中。利用月球穿过地球影子所花费的时间。可以知道 月球轨道的长度与月亮直径比值。进一步估算 得到地球半径与月球半径之比。以及月地距离与月球半径的比值。如果知道地球的半径, 就能得到日地距离。月地距离, 以及太阳。地球和月亮的三者半径。
- 摘要: 通过月食现象，利用天文观测数据推算地球与月球的相对大小及距离关系。

## 古希腊早期哲学思想

### 课程介绍
- 课程主要探讨古希腊早期哲学思想，特别是米利都学派对世界本源的探索。

### 哲学起源与关键人物
- **Telos（泰勒斯）**：
  - 公元前624年，在古希腊城邦米利都的Telos提出科学和哲学思想。
  - 西方思想史上第一个有记载的名字留下来的思想家。
  - 提出并回答了世界本源的问题，将水视为世界的本源。
- **米利都学派传承**：
  - Telos是创始人，阿纳科西曼德（Anaximander）是学生，阿纳科西米尼（Anaximenes）是阿纳科西曼德的学生。

### 世界本源的理论演变
- **Telos的水本源理论**：
  - 认为水是世界的基本物质，但现代观点认为这一答案并不准确。
- **阿纳科西曼德的“无定”理论**：
  - 认为不同物质可以相互转化，反对将水作为世界本源。
  - 提出世界的本源是无定（apeiron），即没有任何规定性的东西。
  - 无定更具普遍适用性，但在“无定具体是什么物质”上未给出明确说明。
- **阿纳科西米尼的“气”理论**：
  - 认为无定难以把握，主张本源是有定的物质——气。
  - 万物由气的凝聚和疏散形成，从定性描述走向定量描述。

### 哲学思想特征
- **质疑的精神**：
  - 学生（如阿纳科西曼德）不盲从老师（Telos），而是标新立意、超越前人。
- **不懈的追求**：
  - 科学家（如米利都学派）不断追问探索世界本源，不以实用为目的，提升对基本问题的认知。
- **科学方法的应用**：
  - 从定性描述（如水、无定）到定量描述（如气的密度变化），体现科学方法的演进。
- **原子论的早期思想**：
  - 刘吉波和德默克利特提出的原子观点在2000多年后得到证实，但米利都学派的思想是其早期探索。

### 核心问题与历史意义
- **最本质的问题**：
  - 从古希腊开始，世界本源的问题一直被人类追问，至今仍是物理学的重要课题。
- **历史意义**：
  - 米利都学派开创了理性探索的传统，为西方哲学和科学奠定了基础。


本部分介绍了古希腊早期哲学思想，重点围绕米利都学派对世界本源的探索展开。从Telos的水本源理论，到阿纳科西曼德的“无定”理论，再到阿纳科西米尼的“气”理论，展示了哲学思想的演变。同时，强调了质疑精神、不懈追求和科学方法的重要性，以及米利都学派对后世科学和哲学的深远影响。
