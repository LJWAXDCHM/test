## 测量地球周长

### 埃拉托斯特尼的方法

**原理**：通过观察亚历山大和塞恩（今阿斯旺）之间同一时间太阳光线与地面的夹角差异来计算地球周长。

**观测数据**：
- 亚历山大与塞恩的距离：D = 5000 stadia (~800 km)
- 太阳光线夹角：θ = 7°

**计算过程**：
1. 基于相似三角形原理，太阳光线与地球半径形成的夹角与两地距离成正比。
2. 公式推导：
   - θ/360° = D/C
   - C = D × 360° ÷ θ

**计算结果**：
- 地球周长 C = 5000 stadia × 360° ÷ 7° ≈ 257000 stadia (~40,000 km)
- 地球半径 R_地球 = C ÷ 2π ≈ 40,000 km ÷ 2π ≈ 6366 km

**埃拉托斯特尼**：公元前276年-194年，古希腊数学家、地理学家、天文学家。

# 测量地球周长

## 埃拉托斯特尼的计算方法

- **夏至日观测**：在夏至日正午时分，太阳光线垂直射入阿斯旺（位于北回归线）。此时，亚历山大城内方尖石塔投下的影子长度可用于计算太阳天顶角。
- **角度测量**：埃拉托斯特尼测量到亚历山大城太阳天顶角为7°（即7/360°）。
- **几何推论**：他推断出亚历山大到阿斯旺的距离占地球周长的7/360。
- **距离估算**：亚历山大到阿斯旺的距离估计在39,690 km至46,620 km之间（现代经纬仪测量实际周长为40,008 km）。

**公式**：
- 地球周长 = 亚历山大-阿斯旺距离 ÷ (7/360)

# 地球为什么是圆的？

## 通过月食现象推断地球球形

- 月食现象是由于地球挡住太阳光照射到月球表面形成的阴影造成的。
- 这个阴影是呈弧形逐渐遮挡住太阳光的，因此可以推断地球是球体形状。

## 测量推算太阳与月亮的远近和相对大小

### 方法原理

- 当月亮在上弦月时，人的视线方向与阳光照射月亮的方向正好是垂直的。
- 此时，记录下太阳与月亮方向的夹角α。
- 夹角α的余弦值等于月地距离与日地距离的比值。

### 公式

**cos(α) = 月地距离 ÷ 日地距离**

### 推论

- 由于太阳和月亮看起来几乎是一样大的，距离的比值也等于它们直径的比值。

## 测量推算地球与月球的距离与相对大小

### 方法原理

- 利用月食过程，通过观测月球穿过地球阴影所需时间来计算月球轨道长度与月亮直径比值。
- 进一步估算得到地球半径与月球半径之比，以及月地距离与月球半径的比值。
- 如果知道地球的半径，就能得到日地距离，月地距离，以及太阳、地球和月亮的三者半径。

### 推论

- 通过月食过程测量月球轨道长度与月亮直径比值，估算地球与月球之间的距离及三者半径关系。

# 古希腊科学成就

## 测量地球周长

**埃拉托斯特尼方法**  
通过测量阳光在特定地点的照射角度差异来估算地球周长。

**关键点**  
- 利用地中海两岸的阳光垂直照射现象（如赛尼和亚历山大城）。
- 记录两地在同一时间阳光的夹角 θ。

**数学公式**  
- 比例关系：θ/360° = D/C  
  其中，θ 为角度差，D 为两地距离，C 为地球周长。
- 周长计算公式：C = D × 360° ÷ θ

**历史数据**  
- 埃拉托斯特尼估算：  
  - 地球周长 C ≈ 250,000 stadia (~40,000 km)  
  - 两地距离 D ≈ 5000 stadia (~800 km)  
  - 角度差 θ ≈ 7°

**地理对应关系**  
- 赛尼（Syene，今阿斯旺）：6月夏至日太阳垂直照射。  
- 亚历山大城：同一时间太阳有夹角 θ。  
- 两地直线距离 D = 5000 stadia。

**计算示例**  
设 θ = 7°，D = 5000 stadia，计算 C：  
C = 5000 × 360° ÷ 7° ≈ 25,714 stadia (~40,000 km)

**历史意义**  
首次系统性地用几何方法测量地球大小，展示了古希腊人对宇宙的精确观测和逻辑推理能力。

## 米利都学派与早期自然哲学

### 学派传承
- 米利都学派的创始人是 Telos。
- 阿纳科西曼德是 Telos 的学生。
- 阿纳科西米尼是阿纳科西曼德的学生。

### 阿纳科西曼德的理论
- **物质转化观点**：阿纳科西曼德认为不同的物质可以相互转化。
- **对水的质疑**：他认为水不应是世界的本源。
- **无定（Apeiron）理论**：主张世界的本源是无定，即没有任何规定性的东西。
- **理论优势**：相比于 Telos 的水理论，阿纳科西曼德的“无定”理论在解释万物的形成和变化规律时更具普遍适用性。

### 阿纳科西米尼的贡献
- **定量描述**：他从密度变化的角度考虑物质的转化过程，将思想从 Telos 和阿纳科西曼德的定性描述推进到定量描述。

### 原子论的历史意义
- 刘吉波和德默克利特提出的原子观点，在2000多年后得到了证实。

### 科学精神与追求
